services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-^localhost|127\\.0\\.0\\.1$$}"
      MAILER_DSN: ${MAILER_DSN:-null://null}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
    volumes:
      - alseq-data:/data
    restart: unless-stopped

volumes:
  alseq-data:
